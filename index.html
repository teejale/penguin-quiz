<!DOCTYPE html>
<html lang="en">
<head>

  <title>The Ultimate Penguin Quiz</title>
  <link rel="stylesheet" href="styles.css">

  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>The ultimate penguin quiz</h1>
    <span>
      <button onclick= changeMode() value = "darkLightBtn" id="modeBtn">Change to dark mode</button>
    </span>
  </header>
  <div id="quiz">
    <div id = "question-container">
      <div id="questions"></div>
    </div id = "img-container">
    <div id="images">
      <img src="" alt="" id="penguins" class="hidden">
    </div>
    <div id = "option-container">
      <div id="options"></div>
    </div>
    <div id = "submit-container">
      <button id="submit">Submit</button>
    </div>
    <div id = "question-container">
      <div id="rightAnswer"></div>
    </div>
    <div>
      <button id="next" class="hide">Next question</button>
    </div>

  </div>
</body>
</html>
